components:
  schemas:
    UserUpdateRequest:
      type: "object"
      properties:
        username:
          type: "string"
        password:
          type: "string"
        email:
          type: "string"
        role:
          type: "string"
    UserResponse:
      type: "object"
      properties:
        userId:
          type: "integer"
          format: "int32"
        username:
          type: "string"
        email:
          type: "string"
        role:
          type: "string"
    UserCreationRequest:
      type: "object"
      properties:
        username:
          type: "string"
        password:
          type: "string"
        email:
          type: "string"
    User:
      type: "object"
      properties:
        userId:
          type: "integer"
          format: "int64"
        username:
          type: "string"
        password:
          type: "string"
        email:
          type: "string"
        role:
          type: "string"
    ChangePasswordRequest:
      type: "object"
      properties:
        oldPassword:
          type: "string"
        newPassword:
          type: "string"
    AuthenticationRequest:
      type: "object"
      properties:
        username:
          type: "string"
        password:
          type: "string"
    AuthenticationResponse:
      type: "object"
      properties:
        token:
          type: "string"
        authenticated:
          type: "boolean"
    IntrospectRequest:
      type: "object"
      properties:
        token:
          type: "string"
        authenticated:
          type: "string"
    IntrospectResponse:
      type: "object"
      properties:
        valid:
          type: "boolean"
    ForgotPasswordRequest:
      type: "object"
      properties:
        gmail:
          type: "string"
    ResetPasswordRequest:
      type: "object"
      properties:
        code:
          type: "string"
        newPassword:
          type: "string"
    MovieUpdateRequest:
      type: "object"
      properties:
        movie_id:
          type: "integer"
          format: "int64"
        title:
          type: "string"
        description:
          type: "string"
        duration:
          type: "integer"
          format: "int32"
        releaseDate:
          type: "string"
          format: "date"
        rating:
          type: "number"
          format: "double"
        typeNames:
          type: "array"
          items:
            type: "string"
        image:
          type: "string"
        trailer:
          type: "string"
        director:
          type: "string"
    MovieResponse:
      type: "object"
      properties:
        movieId:
          type: "integer"
          format: "int32"
        title:
          type: "string"
        description:
          type: "string"
        duration:
          type: "integer"
          format: "int32"
        releaseDate:
          type: "string"
          format: "date"
        rating:
          type: "number"
          format: "double"
        types:
          type: "array"
          items:
            type: "string"
        image:
          type: "string"
        trailer:
          type: "string"
        director:
          type: "string"
    MovieCreationRequest:
      type: "object"
      properties:
        movie_id:
          type: "integer"
          format: "int64"
        title:
          type: "string"
        description:
          type: "string"
        duration:
          type: "integer"
          format: "int32"
        releaseDate:
          type: "string"
          format: "date"
        rating:
          type: "number"
          format: "double"
        typeNames:
          type: "array"
          items:
            type: "string"
